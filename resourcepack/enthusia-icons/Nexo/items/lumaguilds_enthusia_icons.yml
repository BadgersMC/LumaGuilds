# LumaGuilds GUI icons - Enthusia style (16x16).
# Drop into plugins/Nexo/items/ and copy pack/ into plugins/Nexo/pack/, then /nexo reload all.
# IDs that already exist in your current LumaGuilds Nexo config must be removed there first
# (Nexo item IDs have to be unique). New IDs are marked "new".

