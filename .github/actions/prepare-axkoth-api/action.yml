name: Prepare verified AxKoth API dependencies
description: Cache the unchanged official API artifacts and verify downloads before Gradle runs
runs:
  using: composite
  steps:
    - name: Restore pinned AxKoth Maven artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.m2/repository/com/artillexstudios/AxKothAPI/4
          ~/.m2/repository/com/artillexstudios/axapi/axapi/1.4.8
        key: axkoth-api-v5-${{ runner.os }}-${{ hashFiles('ci/axkoth/artifacts.sha256') }}

    - name: Verify cached artifacts or download original published bytes
      shell: bash
      run: |
        python3 -m unittest discover -s "$GITHUB_WORKSPACE/ci/axkoth" -p test_prepare.py
        python3 "$GITHUB_WORKSPACE/ci/axkoth/prepare.py"
