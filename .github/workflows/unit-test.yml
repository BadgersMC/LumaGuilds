name: Unit Test Gradle

on:
  push:
    branches:
      - main
      - staging
      - release/*
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    # Single source of truth: cache key + build step both read this (see build.yml).
    env:
      ROSECHAT_UPSTREAM_REF: 179483128fa2020f3ad8b0e4192ada3d0a251c49 # official Rosewood 26.2 support commit
      PLAYTIME_API_REF: 2a5b57d       # wsg138/PlayTimePlugin commit the API jar is built from
      COMBATLOGX_API_REF: 4812e85af1264ebb27da481b9d9cbf8de0956e53 # last complete 11.6 API source tree
      ENTHUSIASTAFF_API_REF: 8539bb8c77d7ecaf083546dda7ca8ccbfa8064e6 # Staff PR #408 lifecycle API

    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
      
    - name: Setup JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Compile against the canonical official Rosewood 26.2 source.
    - name: Cache RoseChat jar
      id: rosechat-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: libs/RoseChat-RC-2.jar
        key: rosechat-jar-official-${{ env.ROSECHAT_UPSTREAM_REF }}

    - name: Build official RoseChat 26.2 dependency
      if: steps.rosechat-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/Rosewood-Development/RoseChat.git /tmp/rosechat
        cd /tmp/rosechat
        git checkout "$ROSECHAT_UPSTREAM_REF"
        chmod +x gradlew
        ./gradlew -I "$GITHUB_WORKSPACE/ci/rosechat/simpleclans.init.gradle" shadowJar --no-daemon
        mkdir -p "$GITHUB_WORKSPACE/libs"
        ROSE_JAR=$(find build/libs -maxdepth 1 -name 'RoseChat-*.jar'           ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
        test -n "$ROSE_JAR"
        cp "$ROSE_JAR" "$GITHUB_WORKSPACE/libs/RoseChat-RC-2.jar"

    # EnthusiaPlaytime is a Maven project; compiling its API classes directly is
    # faster and more deterministic than a Maven build. The API surface (service
    # interface + state enums + model POJOs) is pure java.util, so plain javac
    # needs no external dependencies. Keep PLAYTIME_API_REF in sync with build.yml.
    - name: Cache EnthusiaPlaytime API jar
      id: playtime-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: libs/EnthusiaPlaytime-api.jar
        key: playtime-api-${{ env.PLAYTIME_API_REF }}

    - name: Build EnthusiaPlaytime API jar
      if: steps.playtime-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/wsg138/PlayTimePlugin.git /tmp/playtime
        cd /tmp/playtime
        git checkout "$PLAYTIME_API_REF"
        mkdir -p "$GITHUB_WORKSPACE/libs" /tmp/playtime-classes
        javac -d /tmp/playtime-classes \
          src/main/java/org/enthusia/playtime/api/PlaytimeService.java \
          src/main/java/org/enthusia/playtime/api/PlaytimeRange.java \
          src/main/java/org/enthusia/playtime/api/PlaytimeMetric.java \
          src/main/java/org/enthusia/playtime/activity/ActivityState.java \
          src/main/java/org/enthusia/playtime/data/model/PlaytimeSnapshot.java \
          src/main/java/org/enthusia/playtime/data/model/RangeTotals.java
        jar cf "$GITHUB_WORKSPACE/libs/EnthusiaPlaytime-api.jar" -C /tmp/playtime-classes .

    # CombatLogX publishes a mutable 11.6-SNAPSHOT that can disappear from its
    # Maven repository. Build the same API version from a pinned source commit
    # so clean CI runners do not depend on stale local Maven metadata.
    - name: Cache CombatLogX API jar
      id: combatlogx-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: libs/CombatLogX-api.jar
        key: combatlogx-api-${{ env.COMBATLOGX_API_REF }}

    - name: Build CombatLogX API jar
      if: steps.combatlogx-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/SirBlobman/CombatLogX.git /tmp/combatlogx
        cd /tmp/combatlogx
        git checkout "$COMBATLOGX_API_REF"
        chmod +x gradlew
        ./gradlew :api:jar --no-daemon
        mkdir -p "$GITHUB_WORKSPACE/libs"
        COMBATLOGX_JAR=$(find api/build/libs -maxdepth 1 -name '*.jar' \
          ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
        test -n "$COMBATLOGX_JAR"
        cp "$COMBATLOGX_JAR" "$GITHUB_WORKSPACE/libs/CombatLogX-api.jar"

    - name: Cache EnthusiaStaff moderation API jar
      id: enthusiastaff-api-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: libs/EnthusiaStaff-moderation-api.jar
        key: enthusiastaff-moderation-api-${{ env.ENTHUSIASTAFF_API_REF }}

    - name: Build EnthusiaStaff moderation API jar
      if: steps.enthusiastaff-api-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/wsg138/EnthusiaStaff.git /tmp/enthusiastaff
        cd /tmp/enthusiastaff
        git checkout "$ENTHUSIASTAFF_API_REF"
        chmod +x gradlew
        ./gradlew :moderation-platform-api:jar --no-daemon
        mkdir -p "$GITHUB_WORKSPACE/libs"
        STAFF_API_JAR=$(find moderation-platform-api/build/libs -maxdepth 1 -name '*.jar' \
          ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
        test -n "$STAFF_API_JAR"
        cp "$STAFF_API_JAR" "$GITHUB_WORKSPACE/libs/EnthusiaStaff-moderation-api.jar"

    - name: Prepare verified AxKoth API dependencies
      uses: ./.github/actions/prepare-axkoth-api

    - name: Test with Gradle
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew test
