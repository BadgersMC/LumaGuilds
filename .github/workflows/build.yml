name: Build Gradle

on:
  push:
    branches:
      - main
      - staging
      - release/*

jobs:
  build:
    runs-on: ubuntu-latest

    # Single source of truth: the cache key and the build step both read this, so
    # bumping the ref can't silently reuse a stale cached jar.
    env:
      ROSECHAT_PREHOOK_REF: 3fe078a   # last RoseChat commit before the LumaGuilds hook
      PLAYTIME_API_REF: 2a5b57d       # wsg138/PlayTimePlugin commit the API jar is built from
      COMBATLOGX_API_REF: 4812e85af1264ebb27da481b9d9cbf8de0956e53 # last complete 11.6 API source tree

    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    # RoseChat <-> LumaGuilds is a circular compile dependency: RoseChat master now
    # carries a LumaGuilds channel hook (needs the LumaGuilds jar to compile), and
    # LumaGuilds needs the RoseChat jar to compile its chat listeners. Both resolve
    # the other via compileOnly files('libs/...'), so building RoseChat master here
    # fails ("package net.lumalyte.lg does not exist"). Build RoseChat at the last
    # PRE-HOOK commit instead: it needs no LumaGuilds jar and still exposes every
    # RoseChat API LumaGuilds compiles against. Keep ROSECHAT_PREHOOK_REF in sync
    # with EnthusiaMarket's CI.
    - name: Cache RoseChat jar
      id: rosechat-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: libs/RoseChat-RC-2.jar
        key: rosechat-jar-prehook-${{ env.ROSECHAT_PREHOOK_REF }}

    - name: Build RoseChat (pre-hook) dependency
      if: steps.rosechat-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/BadgersMC/Enthusia-RoseChat.git /tmp/rosechat
        cd /tmp/rosechat
        git checkout "$ROSECHAT_PREHOOK_REF"
        chmod +x gradlew
        ./gradlew shadowJar --no-daemon
        mkdir -p "$GITHUB_WORKSPACE/libs"
        ROSE_JAR=$(ls build/libs/RoseChat-RC-2*.jar | grep -v -- '-sources\|-javadoc' | head -1)
        cp "$ROSE_JAR" "$GITHUB_WORKSPACE/libs/RoseChat-RC-2.jar"

# EnthusiaPlaytime is a Maven project; compiling its API classes directly is
    # faster and more deterministic than a Maven build. The API surface (service
    # interface + state enums + model POJOs) is pure java.util, so plain javac
    # needs no external dependencies. Keep PLAYTIME_API_REF in sync with unit-test.yml.
    - name: Cache EnthusiaPlaytime API jar
      id: playtime-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: libs/EnthusiaPlaytime-api.jar
        key: playtime-api-${{ env.PLAYTIME_API_REF }}

    - name: Build EnthusiaPlaytime API jar
      if: steps.playtime-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/wsg138/PlayTimePlugin.git /tmp/playtime
        cd /tmp/playtime
        git checkout "$PLAYTIME_API_REF"
        mkdir -p "$GITHUB_WORKSPACE/libs" /tmp/playtime-classes
        javac -d /tmp/playtime-classes \
          src/main/java/org/enthusia/playtime/api/PlaytimeService.java \
          src/main/java/org/enthusia/playtime/api/PlaytimeRange.java \
          src/main/java/org/enthusia/playtime/api/PlaytimeMetric.java \
          src/main/java/org/enthusia/playtime/activity/ActivityState.java \
          src/main/java/org/enthusia/playtime/data/model/PlaytimeSnapshot.java \
          src/main/java/org/enthusia/playtime/data/model/RangeTotals.java
        jar cf "$GITHUB_WORKSPACE/libs/EnthusiaPlaytime-api.jar" -C /tmp/playtime-classes .

    - name: Cache CombatLogX API jar
      id: combatlogx-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: libs/CombatLogX-api.jar
        key: combatlogx-api-${{ env.COMBATLOGX_API_REF }}

    - name: Build CombatLogX API jar
      if: steps.combatlogx-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/SirBlobman/CombatLogX.git /tmp/combatlogx
        cd /tmp/combatlogx
        git checkout "$COMBATLOGX_API_REF"
        chmod +x gradlew
        ./gradlew :api:jar --no-daemon
        mkdir -p "$GITHUB_WORKSPACE/libs"
        cp api/build/libs/api-11.6-SNAPSHOT.jar "$GITHUB_WORKSPACE/libs/CombatLogX-api.jar"

    - name: Test with Gradle
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew test

    - name: Build Gradle using shadowJar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew shadowJar

    - name: Save Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: build/libs/
